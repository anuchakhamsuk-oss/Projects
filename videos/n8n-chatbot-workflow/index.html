<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>n8n Chatbot Workflow</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kanit";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/kanit-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 600;
        font-style: normal;
        src: url("assets/fonts/kanit-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/kanit-700.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 800;
        font-style: normal;
        src: url("assets/fonts/kanit-800.ttf") format("truetype");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d0f14;
      }
      body {
        font-family: "Kanit", sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d0f14;
        color: #f5f6f8;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* ---------- canvas background ---------- */
      #canvas-clip {
        background:
          radial-gradient(58% 34% at 50% 42%, rgba(255, 109, 90, 0.13), transparent 72%),
          radial-gradient(46% 26% at 50% 82%, rgba(167, 139, 250, 0.09), transparent 74%), #0d0f14;
      }
      #canvas-dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.075) 2px, transparent 2px);
        background-size: 48px 48px;
        opacity: 0;
      }

      /* ---------- node graph ---------- */
      #graph {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .node-box {
        fill: #1a1d26;
        stroke: #2c3140;
        stroke-width: 3;
      }
      .node-box.is-main {
        stroke: #3a4152;
      }
      .node-box.is-agent {
        stroke: #ff6d5a;
        stroke-width: 4;
      }
      .node-glow {
        fill: #ff6d5a;
        opacity: 0;
      }
      .sub-glow {
        fill: #a78bfa;
        opacity: 0;
      }
      .node-title {
        fill: #f5f6f8;
        font-family: "Kanit", sans-serif;
        font-size: 34px;
        font-weight: 700;
      }
      .node-sub {
        fill: #8b93a1;
        font-family: "Kanit", sans-serif;
        font-size: 24px;
        font-weight: 400;
      }
      .sub-label {
        fill: #d2d7e0;
        font-family: "Kanit", sans-serif;
        font-size: 24px;
        font-weight: 600;
        text-anchor: middle;
      }
      .conn {
        fill: none;
        stroke: #ff6d5a;
        stroke-width: 5;
        stroke-linecap: round;
        opacity: 0.9;
      }
      .conn.is-sub {
        stroke: #a78bfa;
        stroke-width: 3;
        opacity: 0.55;
      }
      .flow {
        fill: none;
        stroke: #ffc7bd;
        stroke-width: 9;
        stroke-linecap: round;
        opacity: 0;
      }
      #top-label {
        fill: #8b93a1;
        font-family: "Kanit", sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 7px;
        text-anchor: middle;
        opacity: 0;
      }
      .bubble-box {
        fill: #ff6d5a;
      }
      .bubble-text {
        fill: #1b0f0d;
        font-family: "Kanit", sans-serif;
        font-size: 30px;
        font-weight: 600;
        text-anchor: middle;
      }

      /* ---------- end card ---------- */
      #endcard-clip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #0d0f14;
        opacity: 0;
      }
      #end-line-1 {
        font-size: 74px;
        font-weight: 800;
        line-height: 1.3;
        color: #f5f6f8;
      }
      #end-line-2 {
        font-size: 74px;
        font-weight: 800;
        line-height: 1.3;
        color: #ff6d5a;
      }
      #end-line-3 {
        margin-top: 26px;
        font-size: 36px;
        font-weight: 600;
        color: #8b93a1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- background canvas (0 - 10s) -->
      <div id="canvas-clip" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="canvas-dots"></div>
      </div>

      <!-- node graph (0 - 10s) -->
      <div id="graph-clip" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <svg id="graph" viewBox="0 0 1080 1920">
          <defs>
            <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="18" />
            </filter>
          </defs>

          <text id="top-label" x="540" y="152">N8N · CHATBOT WORKFLOW</text>

          <!-- connectors (drawn under the nodes) -->
          <path id="conn-ab" class="conn" d="M 540 475 C 540 555 540 625 540 705" />
          <path id="conn-bc" class="conn" d="M 780 790 C 985 855 985 1495 760 1560" />
          <path id="conn-s1" class="conn is-sub" d="M 540 875 C 540 980 300 985 300 1068" />
          <path id="conn-s2" class="conn is-sub" d="M 540 875 L 540 1068" />
          <path id="conn-s3" class="conn is-sub" d="M 540 875 C 540 980 780 985 780 1068" />

          <!-- travelling data packets -->
          <path id="flow-ab" class="flow" d="M 540 475 C 540 555 540 625 540 705" />
          <path id="flow-bc" class="flow" d="M 780 790 C 985 855 985 1495 760 1560" />

          <!-- node A — chat trigger -->
          <g id="node-a" class="node">
            <rect
              class="node-glow"
              x="320"
              y="325"
              width="440"
              height="150"
              rx="30"
              filter="url(#soft-glow)"
            />
            <rect class="node-box is-main" x="320" y="325" width="440" height="150" rx="30" />
            <g transform="translate(398, 400)">
              <rect
                x="-26"
                y="-24"
                width="52"
                height="40"
                rx="12"
                fill="none"
                stroke="#ff6d5a"
                stroke-width="4"
              />
              <path
                d="M -10 16 L -3 28 L 5 16"
                fill="none"
                stroke="#ff6d5a"
                stroke-width="4"
                stroke-linejoin="round"
              />
              <circle cx="-11" cy="-4" r="3.4" fill="#ff6d5a" />
              <circle cx="0" cy="-4" r="3.4" fill="#ff6d5a" />
              <circle cx="11" cy="-4" r="3.4" fill="#ff6d5a" />
            </g>
            <text class="node-title" x="466" y="392">รับข้อความ</text>
            <text class="node-sub" x="466" y="434">Chat Trigger</text>
          </g>

          <!-- node B — AI agent -->
          <g id="node-b" class="node">
            <rect
              class="node-glow"
              x="300"
              y="705"
              width="480"
              height="170"
              rx="32"
              filter="url(#soft-glow)"
            />
            <rect class="node-box is-agent" x="300" y="705" width="480" height="170" rx="32" />
            <g transform="translate(383, 790)">
              <path d="M 0 -30 L 8 -8 L 30 0 L 8 8 L 0 30 L -8 8 L -30 0 L -8 -8 Z" fill="#ff6d5a" />
            </g>
            <text class="node-title" x="452" y="782">AI Agent</text>
            <text class="node-sub" x="452" y="826">ประมวลผลคำตอบ</text>
          </g>

          <!-- sub nodes -->
          <g id="sub-1" class="node">
            <rect
              class="sub-glow"
              x="195"
              y="1068"
              width="210"
              height="104"
              rx="20"
              filter="url(#soft-glow)"
            />
            <rect class="node-box" x="195" y="1068" width="210" height="104" rx="20" />
            <circle cx="300" cy="1104" r="9" fill="#a78bfa" />
            <text class="sub-label" x="300" y="1148">Chat Model</text>
          </g>
          <g id="sub-2" class="node">
            <rect
              class="sub-glow"
              x="435"
              y="1068"
              width="210"
              height="104"
              rx="20"
              filter="url(#soft-glow)"
            />
            <rect class="node-box" x="435" y="1068" width="210" height="104" rx="20" />
            <circle cx="540" cy="1104" r="9" fill="#a78bfa" />
            <text class="sub-label" x="540" y="1148">Memory</text>
          </g>
          <g id="sub-3" class="node">
            <rect
              class="sub-glow"
              x="675"
              y="1068"
              width="210"
              height="104"
              rx="20"
              filter="url(#soft-glow)"
            />
            <rect class="node-box" x="675" y="1068" width="210" height="104" rx="20" />
            <circle cx="780" cy="1104" r="9" fill="#a78bfa" />
            <text class="sub-label" x="780" y="1148">Knowledge</text>
          </g>

          <!-- node C — send reply -->
          <g id="node-c" class="node">
            <rect
              class="node-glow"
              x="320"
              y="1485"
              width="440"
              height="150"
              rx="30"
              filter="url(#soft-glow)"
            />
            <rect class="node-box is-main" x="320" y="1485" width="440" height="150" rx="30" />
            <g transform="translate(398, 1560)">
              <path d="M -26 -4 L 26 -22 L 10 24 L 2 6 Z" fill="#ff6d5a" />
            </g>
            <text class="node-title" x="466" y="1552">ตอบกลับอัตโนมัติ</text>
            <text class="node-sub" x="466" y="1594">Send Message</text>
          </g>

          <!-- reply bubble -->
          <g id="reply-bubble">
            <path class="bubble-box" d="M 470 1692 L 512 1660 L 534 1692 Z" />
            <rect class="bubble-box" x="250" y="1690" width="580" height="112" rx="30" />
            <text class="bubble-text" x="540" y="1757">สวัสดีครับ ยินดีให้บริการครับ</text>
          </g>
        </svg>
      </div>

      <!-- end card (7.9 - 10s) -->
      <div id="endcard-clip" class="clip" data-start="7.9" data-duration="2.1" data-track-index="2">
        <div id="end-line-1">แชทบอทตอบลูกค้าเอง</div>
        <div id="end-line-2">24 ชั่วโมง</div>
        <div id="end-line-3">ออกแบบ workflow ด้วย n8n</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- helpers ---------- */
      function drawIn(sel, at, dur) {
        var el = document.querySelector(sel);
        var len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(
          el,
          { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", overwrite: "auto" },
          at,
        );
      }

      function popNode(sel, at, dur) {
        gsap.set(sel, { transformOrigin: "50% 50%" });
        tl.fromTo(
          sel,
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: dur, ease: "back.out(1.9)" },
          at,
        );
      }

      function packet(sel, at, dur, peak) {
        var el = document.querySelector(sel);
        var len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: "90 " + len, strokeDashoffset: 90 });
        tl.set(el, { opacity: peak }, at);
        tl.fromTo(
          el,
          { strokeDashoffset: 90 },
          { strokeDashoffset: -len, duration: dur, ease: "power1.inOut", overwrite: "auto" },
          at,
        );
        tl.set(el, { opacity: 0 }, at + dur);
      }

      function pulse(sel, at, peak) {
        tl.fromTo(
          sel,
          { opacity: 0 },
          { opacity: peak, duration: 0.22, ease: "power2.out" },
          at,
        );
        tl.to(sel, { opacity: 0, duration: 0.42, ease: "power2.in" }, at + 0.24);
      }

      /* ---------- 0.0 - 4.0s · the workflow assembles ---------- */
      tl.to("#canvas-dots", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.05);
      tl.to("#top-label", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);

      popNode("#node-a", 0.4, 0.55);
      drawIn("#conn-ab", 0.9, 0.55);
      popNode("#node-b", 1.35, 0.6);

      drawIn("#conn-s1", 1.9, 0.5);
      drawIn("#conn-s2", 2.0, 0.5);
      drawIn("#conn-s3", 2.1, 0.5);
      popNode("#sub-1", 2.15, 0.45);
      popNode("#sub-2", 2.3, 0.45);
      popNode("#sub-3", 2.45, 0.45);

      drawIn("#conn-bc", 2.9, 0.7);
      popNode("#node-c", 3.45, 0.55);

      /* ---------- 4.2 - 7.8s · a message runs the workflow ---------- */
      packet("#flow-ab", 4.2, 0.8, 1);
      pulse("#node-b .node-glow", 5.0, 0.5);
      pulse("#sub-1 .sub-glow", 5.1, 0.45);
      pulse("#sub-2 .sub-glow", 5.24, 0.45);
      pulse("#sub-3 .sub-glow", 5.38, 0.45);

      packet("#flow-bc", 5.5, 0.85, 1);
      pulse("#node-c .node-glow", 6.35, 0.5);

      gsap.set("#reply-bubble", { transformOrigin: "50% 50%" });
      tl.fromTo(
        "#reply-bubble",
        { scale: 0.6, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(2.1)" },
        6.6,
      );

      /* second, faster pass — the loop keeps running */
      packet("#flow-ab", 6.95, 0.55, 0.75);
      packet("#flow-bc", 7.25, 0.55, 0.75);

      /* ---------- 7.9 - 10.0s · end card ---------- */
      tl.to("#graph-clip", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 7.9);
      tl.to("#endcard-clip", { opacity: 1, duration: 0.45, ease: "power2.out" }, 7.9);
      tl.fromTo(
        "#end-line-1",
        { y: 26, opacity: 0, filter: "blur(12px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
        8.35,
      );
      tl.fromTo(
        "#end-line-2",
        { y: 26, opacity: 0, filter: "blur(12px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
        8.5,
      );
      tl.fromTo(
        "#end-line-3",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        8.7,
      );

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
