<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>n8n Automation Promo</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kanit";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/kanit-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 600;
        font-style: normal;
        src: url("assets/fonts/kanit-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/kanit-700.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 800;
        font-style: normal;
        src: url("assets/fonts/kanit-800.ttf") format("truetype");
      }
      @font-face {
        font-family: "Kanit";
        font-weight: 900;
        font-style: normal;
        src: url("assets/fonts/kanit-900.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0d12;
      }
      body {
        font-family: "Kanit", sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0d12;
        color: #f5f6f8;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* ---------- background (persistent) ---------- */
      #bg-grid {
        background:
          radial-gradient(60% 40% at 50% 30%, rgba(255, 109, 90, 0.16), transparent 70%),
          radial-gradient(50% 35% at 50% 78%, rgba(255, 109, 90, 0.1), transparent 70%),
          #0b0d12;
      }
      #bg-grid .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.06) 2px, transparent 2px);
        background-size: 54px 54px;
        opacity: 0.5;
      }
      #bg-grid .glow {
        position: absolute;
        width: 900px;
        height: 900px;
        left: 50%;
        top: 50%;
        margin: -450px 0 0 -450px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 109, 90, 0.22), transparent 65%);
        filter: blur(10px);
      }

      /* ---------- scene 1: hook ---------- */
      #hook-clip {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 28px;
        padding: 0 90px;
        text-align: center;
      }
      #hook-clip .hook-line {
        font-size: 82px;
        font-weight: 700;
        line-height: 1.25;
        color: #f5f6f8;
      }
      #hook-clip .hook-sub {
        font-size: 34px;
        font-weight: 400;
        color: #9aa1ad;
      }

      /* ---------- scene 2: build (node graph) ---------- */
      #build-clip {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 64px;
      }
      #node-graph {
        width: 820px;
        height: 760px;
        overflow: visible;
      }
      .node-circle {
        fill: #14171f;
        stroke: #ff6d5a;
        stroke-width: 4;
      }
      .node-icon {
        fill: #f5f6f8;
        font-family: "Kanit", sans-serif;
        font-size: 34px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .node-label {
        fill: #9aa1ad;
        font-family: "Kanit", sans-serif;
        font-size: 26px;
        font-weight: 400;
        text-anchor: middle;
      }
      .node-path {
        fill: none;
        stroke: #ff6d5a;
        stroke-width: 5;
        stroke-linecap: round;
        opacity: 0.85;
      }
      #build-clip .build-text {
        font-size: 56px;
        font-weight: 700;
        text-align: center;
        padding: 0 90px;
      }
      #build-clip .build-text .accent {
        color: #ff6d5a;
      }

      /* ---------- scene 3: punch ---------- */
      #punch-clip {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 36px;
      }
      #punch-word {
        font-size: 168px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: #f5f6f8;
        text-shadow: 0 0 0 rgba(255, 109, 90, 0);
      }
      #punch-sub {
        font-size: 44px;
        font-weight: 600;
        text-align: center;
      }
      #punch-sub .accent {
        color: #ff6d5a;
        font-weight: 800;
      }

      /* ---------- scene 4: resolve ---------- */
      #resolve-clip {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 26px;
      }
      #resolve-ring {
        position: absolute;
        width: 540px;
        height: 540px;
        border: 6px solid #ff6d5a;
        border-radius: 50%;
        opacity: 0;
      }
      #resolve-flash {
        position: absolute;
        inset: 0;
        background: #ffffff;
        opacity: 0;
      }
      #resolve-wordmark {
        font-size: 176px;
        font-weight: 900;
        color: #f5f6f8;
        letter-spacing: -0.02em;
        z-index: 2;
      }
      #resolve-tagline {
        font-size: 46px;
        font-weight: 700;
        color: #ff6d5a;
        z-index: 2;
      }
      #resolve-caption {
        font-size: 30px;
        font-weight: 400;
        color: #9aa1ad;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- persistent background -->
      <div id="bg-grid" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div class="dots"></div>
        <div class="glow" id="bg-glow"></div>
      </div>

      <!-- scene 1: hook (0.0 - 2.4s) -->
      <div id="hook-clip" class="clip" data-start="0" data-duration="2.4" data-track-index="1">
        <div class="hook-line" id="hook-line">เบื่อทำงานซ้ำซากทุกวันไหม?</div>
        <div class="hook-sub" id="hook-sub">งานเดิม ๆ ที่ทำมือทุกวัน กินเวลาไปเยอะกว่าที่คิด</div>
      </div>

      <!-- scene 2: build (2.4 - 5.0s) -->
      <div id="build-clip" class="clip" data-start="2.4" data-duration="2.6" data-track-index="2">
        <svg id="node-graph" viewBox="0 0 820 760">
          <path id="path-1-2" class="node-path" d="M 280 140 C 280 320, 560 320, 560 460" />
          <path id="path-2-3" class="node-path" d="M 560 460 C 560 600, 280 600, 280 700" />

          <circle id="node-1" class="node-circle" cx="280" cy="140" r="70" />
          <text class="node-icon" x="280" y="140">▶</text>
          <text class="node-label" x="280" y="236">Trigger</text>

          <circle id="node-2" class="node-circle" cx="560" cy="460" r="70" />
          <text class="node-icon" x="560" y="460">⚙</text>
          <text class="node-label" x="560" y="556">n8n</text>

          <circle id="node-3" class="node-circle" cx="280" cy="700" r="70" />
          <text class="node-icon" x="280" y="700">✓</text>
          <text class="node-label" x="280" y="796">Done</text>
        </svg>
        <div class="build-text" id="build-text">
          ให้ <span class="accent">n8n</span> ทำงานแทนคุณ<br />แบบอัตโนมัติ
        </div>
      </div>

      <!-- scene 3: punch (5.0 - 7.6s) -->
      <div id="punch-clip" class="clip" data-start="5.0" data-duration="2.6" data-track-index="3">
        <div id="punch-word">AUTOMATE</div>
        <div id="punch-sub">ประหยัดเวลาได้มากกว่า <span class="accent">10 เท่า</span></div>
      </div>

      <!-- scene 4: resolve (7.6 - 10.0s) -->
      <div
        id="resolve-clip"
        class="clip"
        data-start="7.6"
        data-duration="2.4"
        data-track-index="4"
      >
        <div id="resolve-ring"></div>
        <div id="resolve-flash"></div>
        <div id="resolve-wordmark">n8n</div>
        <div id="resolve-tagline">Automate Everything.</div>
        <div id="resolve-caption">ระบบอัตโนมัติสำหรับทุกงานที่คุณทำซ้ำ</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- background glow: slow persistent pulse ---------- */
      tl.to(
        "#bg-glow",
        { scale: 1.15, opacity: 0.7, duration: 2.5, ease: "sine.inOut", repeat: 3, yoyo: true },
        0,
      );
      gsap.set("#bg-glow", { transformOrigin: "50% 50%" });

      /* ---------- scene 1: hook ---------- */
      tl.fromTo(
        "#hook-line",
        { y: 30, opacity: 0, filter: "blur(18px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
        0.15,
      );
      tl.fromTo(
        "#hook-sub",
        { y: 24, opacity: 0, filter: "blur(14px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        0.45,
      );
      tl.to(
        ["#hook-line", "#hook-sub"],
        { y: -24, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.05,
      );

      /* ---------- scene 2: build (node graph) ---------- */
      ["#path-1-2", "#path-2-3"].forEach(function (sel, i) {
        var el = document.querySelector(sel);
        var len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(
          el,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" },
          2.55 + i * 0.5,
        );
      });

      ["#node-1", "#node-2", "#node-3"].forEach(function (sel, i) {
        gsap.set(sel, { transformOrigin: "50% 50%" });
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" },
          2.5 + i * 0.35,
        );
      });

      tl.fromTo(
        "#build-text",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.75,
      );
      tl.to("#build-clip > *", { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.75);
      tl.set("#build-clip > *", { opacity: 0 }, 5.0);

      /* ---------- scene 3: punch ---------- */
      tl.fromTo(
        "#punch-word",
        { y: -260, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
        5.15,
      );
      tl.to(
        "#punch-word",
        { keyframes: [{ x: -8 }, { x: 8 }, { x: 0 }], duration: 0.18, ease: "none" },
        5.6,
      );
      tl.to(
        "#punch-word",
        {
          textShadow: "0 0 60px rgba(255,109,90,0.85)",
          duration: 0.35,
          yoyo: true,
          repeat: 1,
        },
        5.6,
      );
      tl.fromTo(
        "#punch-sub",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.95,
      );
      tl.fromTo(
        "#punch-sub .accent",
        { scale: 1 },
        { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" },
        6.35,
      );
      tl.to("#punch-clip > *", { opacity: 0, duration: 0.25, ease: "power2.in" }, 7.35);
      tl.set("#punch-clip > *", { opacity: 0 }, 7.6);

      /* ---------- scene 4: resolve ---------- */
      gsap.set("#resolve-wordmark", { transformOrigin: "50% 50%" });
      tl.fromTo(
        "#resolve-wordmark",
        { scale: 1.15, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" },
        7.75,
      );
      tl.set("#resolve-ring", { opacity: 0.9, scale: 0.34 }, 8.1);
      tl.to("#resolve-ring", { scale: 2.2, opacity: 0, duration: 0.5, ease: "power3.out" }, 8.1);
      tl.set("#resolve-flash", { opacity: 1 }, 8.1);
      tl.set("#resolve-flash", { opacity: 0 }, 8.13);
      tl.fromTo(
        "#resolve-tagline",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.35,
      );
      tl.fromTo(
        "#resolve-caption",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.6,
      );

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
