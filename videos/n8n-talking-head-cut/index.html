      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #08080b; }
      body { font-family: "Kanit", sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #08080b; color: #fff; }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* ================= shared look ================= */
      .darkbg {
        background:
          radial-gradient(66% 40% at 50% 40%, rgba(255, 45, 85, 0.16), transparent 72%),
          radial-gradient(50% 30% at 50% 86%, rgba(180, 12, 50, 0.12), transparent 74%), #08080b;
      }
      .stars {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(rgba(255,255,255,0.42) 1.5px, transparent 1.5px),
          radial-gradient(rgba(255,255,255,0.24) 1.5px, transparent 1.5px);
        background-size: 250px 250px, 165px 165px;
        background-position: 0 0, 85px 110px;
        opacity: 0.5;
      }
      .accent { color: #ff4d70; }

      /* ================= 1 · intro ================= */
      #intro-clip {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      }
      #intro-mark { opacity: 0; }
      #intro-1 { font-size: 46px; font-weight: 600; color: #98a0ad; opacity: 0; }
      #intro-2 { font-size: 104px; font-weight: 800; line-height: 1.22; text-align: center; opacity: 0; }
      #intro-3 { font-size: 44px; font-weight: 700; color: #ff4d70; opacity: 0; margin-top: 8px; }

      /* ================= 2 · the footage ================= */
      #vid-clip { background: transparent; }
      #talking {
        position: absolute; left: 0; top: 0;
        width: 1080px; height: 1920px;
        object-fit: cover; background: #000;
      }
      /* keeps the face readable under the overlays */
      #vid-scrim {
        position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(6,6,10,0.78) 0%, transparent 22%),
          linear-gradient(0deg, rgba(6,6,10,0.86) 0%, transparent 30%);
      }
      #brandbar {
        position: absolute; top: 74px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 16px;
        padding: 16px 34px; border-radius: 999px;
        background: rgba(12,12,18,0.72); border: 2px solid rgba(255,77,112,0.5);
        box-shadow: 0 0 40px rgba(255,45,85,0.3);
        opacity: 0;
      }
      #brandbar .txt { font-size: 34px; font-weight: 700; letter-spacing: 0.5px; }
      #lower {
        position: absolute; left: 70px; bottom: 300px; opacity: 0;
      }
      #lower .rule { width: 96px; height: 7px; border-radius: 4px; background: #ff4d70; margin-bottom: 18px; }
      #lower .l1 { font-size: 58px; font-weight: 800; line-height: 1.2; }
      #lower .l2 { font-size: 36px; font-weight: 600; color: #c9cfda; margin-top: 6px; }

      /* caption slot — filled once the spoken script arrives */
      #caption {
        position: absolute; left: 60px; right: 60px; bottom: 150px;
        text-align: center; font-size: 52px; font-weight: 800; line-height: 1.3;
        text-shadow: 0 6px 26px rgba(0,0,0,0.9), 0 2px 8px rgba(0,0,0,0.9);
        opacity: 0;
      }

      /* ================= 3 · explainer ================= */
      #ex-clip { }
      #ex-head {
        position: absolute; top: 210px; left: 60px; right: 60px; text-align: center;
        font-size: 68px; font-weight: 800; opacity: 0;
      }
      #ex-svg { position: absolute; inset: 0; }
      .wire { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 9; stroke-linecap: round; }
      .wire-glow { fill: none; stroke: rgba(255,120,150,0.22); stroke-width: 26; stroke-linecap: round; }
      .pulse { fill: none; stroke: #fff; stroke-width: 13; stroke-linecap: round; opacity: 0; }
      .exnode {
        position: absolute; display: flex; align-items: center; justify-content: center;
        border-radius: 999px; white-space: nowrap; opacity: 0;
        background: linear-gradient(180deg, #ff3b63 0%, #e2093c 100%);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.16) inset, 0 0 50px rgba(255,45,85,0.55), 0 16px 40px rgba(0,0,0,0.55);
        color: #fff; font-weight: 700;
      }
      .exnode.ghost {
        background: linear-gradient(180deg, #3a3d47 0%, #23252c 100%);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.1) inset, 0 14px 34px rgba(0,0,0,0.55);
        color: #e6e8ee; font-weight: 600;
      }

      /* ================= 4 · CTA ================= */
      #cta-clip {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      }
      #cta-1 { font-size: 76px; font-weight: 800; opacity: 0; }
      #cta-pill {
        display: flex; align-items: center; justify-content: center;
        padding: 34px 70px; border-radius: 999px; font-size: 52px; font-weight: 700;
        background: linear-gradient(180deg, #ff3b63 0%, #e2093c 100%);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.18) inset, 0 0 60px rgba(255,45,85,0.6);
        opacity: 0; margin-top: 10px;
      }
      #cta-2 { font-size: 38px; font-weight: 600; color: #98a0ad; opacity: 0; margin-top: 10px; }

      function pop(sel, at, dur) {
        gsap.set(sel, { transformOrigin: "50% 50%" });
        tl.fromTo(sel, { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: dur || 0.5, ease: "back.out(1.9)" }, at);

        var el = document.querySelector(sel), len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", overwrite: "auto" }, at);
      }
      function packet(sel, at, dur) {
        var el = document.querySelector(sel), len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: "120 " + len, strokeDashoffset: 120 });
        tl.set(el, { opacity: 1 }, at);
        tl.fromTo(el, { strokeDashoffset: 120 },
          { strokeDashoffset: -len, duration: dur, ease: "power1.inOut", overwrite: "auto" }, at);
