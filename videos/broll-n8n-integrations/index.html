    <style>
      @font-face { font-family: "Kanit"; font-weight: 600; font-style: normal; src: url("assets/fonts/kanit-600.ttf") format("truetype"); }
      @font-face { font-family: "Kanit"; font-weight: 700; font-style: normal; src: url("assets/fonts/kanit-700.ttf") format("truetype"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050614; }
      body { font-family: "Kanit", sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050614; }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* ---------- deep cyber environment ---------- */
      #bg-clip {
        background:
          radial-gradient(42% 24% at 52% 46%, rgba(99, 102, 241, 0.22), transparent 70%),
          radial-gradient(46% 26% at 22% 22%, rgba(56, 189, 248, 0.14), transparent 72%),
          radial-gradient(44% 26% at 82% 76%, rgba(168, 85, 247, 0.16), transparent 72%),
          linear-gradient(168deg, #070a1e 0%, #05060f 55%, #04050c 100%);
      }
      /* defocused city / dashboard panels — gradients only, no blur filter (cheap to render) */
      #bg-panels { position: absolute; inset: 0; opacity: 0.5; }
      .panel {
        position: absolute; border-radius: 18px;
        background: linear-gradient(160deg, rgba(80,140,255,0.14), rgba(140,80,255,0.06) 60%, transparent);
        box-shadow: 0 0 60px 20px rgba(70, 120, 255, 0.07);
      }
      .glowdot {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle, rgba(190,225,255,0.75), rgba(110,160,255,0.25) 45%, transparent 70%);
      }

      /* ---------- camera rig ---------- */
      #stage { position: absolute; inset: 0; perspective: 1600px; }
      #camera { position: absolute; inset: 0; transform-origin: 540px 900px; }
      #tilt { position: absolute; inset: 0; transform-style: preserve-3d; }
      #field { position: absolute; inset: 0; }

      /* ---------- cards ---------- */
      .card {
        position: absolute;
        border-radius: 30px;
        background: linear-gradient(155deg, rgba(26,32,58,0.97) 0%, rgba(11,14,30,0.97) 100%);
        border: 2px solid rgba(165, 185, 255, 0.55);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.05) inset,
          0 0 26px rgba(150, 180, 255, 0.30) inset,
          0 0 58px rgba(110, 140, 255, 0.5),
          0 26px 60px rgba(0,0,0,0.62);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px;
        opacity: 0;
      }
      .card .leds { position: absolute; top: 14px; right: 18px; display: flex; gap: 7px; }
      .card .leds i { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }
      .card .leds i:nth-child(2) { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
      .card .leds i:nth-child(3) { background: #c084fc; box-shadow: 0 0 8px #c084fc; }
      .card .mark { display: block; }
      .card .label {
        color: #eef2ff; font-size: 26px; font-weight: 700; letter-spacing: 0.3px;
        text-align: center; line-height: 1.15; text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      }

      /* the n8n core */
      #core {
        border-radius: 44px;
        border: 3px solid rgba(234, 75, 113, 0.55);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.07) inset,
          0 0 90px rgba(234, 75, 113, 0.45),
          0 0 190px rgba(120, 90, 255, 0.3),
          0 34px 80px rgba(0,0,0,0.7);
      }
      #core .label { font-size: 46px; }
      #core-ring {
        position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px;
        border-radius: 50%; border: 2px solid rgba(234, 75, 113, 0.5); opacity: 0; pointer-events: none;
      }

      /* ---------- cables ---------- */
      /* two strokes instead of a blur filter: a wide soft body under a bright core */
      .cable-glow { fill: none; stroke: rgba(120, 165, 255, 0.20); stroke-width: 16; stroke-linecap: round; }
      .cable      { fill: none; stroke: rgba(196, 220, 255, 0.85); stroke-width: 4;  stroke-linecap: round; }
      .pulse      { fill: none; stroke: #ffffff; stroke-width: 9; stroke-linecap: round; opacity: 0; }
      .pulse-wide { fill: none; stroke: rgba(140, 190, 255, 0.5); stroke-width: 22; stroke-linecap: round; opacity: 0; }

      /* ---------- grade ---------- */
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(82% 62% at 50% 47%, transparent 58%, rgba(2, 3, 10, 0.72) 100%);
      }
    </style>

        el.style.height = cfg.size + "px";
        el.style.left = (cfg.x - cfg.size / 2) + "px";
        el.style.top = (cfg.y - cfg.size / 2) + "px";
        var spec = cfg.brand ? BRANDS[cfg.brand] : GENERIC[cfg.generic];
        var iconPx = isCore ? 118 : Math.round(cfg.size * 0.34);
        el.innerHTML =
          '<div class="leds"><i></i><i></i><i></i></div>' +
          iconSvg(spec, iconPx) +
          '<div class="label">' + cfg.label.replace(/\n/g, "<br>") + "</div>";
        field.appendChild(el);
        return el;
      }

      /* core first in DOM so the satellites paint above the cables */
      var coreEl = makeCard({ id: "core", x: CORE.x, y: CORE.y, size: CORE.size, brand: "n8n", label: "n8n" }, true);
      coreEl.id = "core";
      var ring = document.createElement("div");
      ring.id = "core-ring";
      coreEl.appendChild(ring);

      /* ---------- cables from the core to every node ---------- */
      var cables = [];
      NODES.forEach(function (n, k) {
        var dx = n.x - CORE.x, dy = n.y - CORE.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var ux = dx / dist, uy = dy / dist;
        // leave the core from its edge, arrive at the card edge
        var x1 = CORE.x + ux * (CORE.size / 2 - 6);
        var y1 = CORE.y + uy * (CORE.size / 2 - 6);
        var x2 = n.x - ux * (n.size / 2 - 6);
        var y2 = n.y - uy * (n.size / 2 - 6);
        // bow each cable to one side so they read as separate strands
        var side = k % 2 === 0 ? 1 : -1;
        var bow = 90 + (k % 3) * 46;
        var mx = (x1 + x2) / 2 - uy * bow * side;
        var my = (y1 + y2) / 2 + ux * bow * side;
        var d = "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
                " Q " + mx.toFixed(1) + " " + my.toFixed(1) +
                " " + x2.toFixed(1) + " " + y2.toFixed(1);

        ["cable-glow", "cable", "pulse-wide", "pulse"].forEach(function (cls) {
          var p = document.createElementNS(SVGNS, "path");
          p.setAttribute("class", cls);
          p.setAttribute("d", d);
          if (cls === "pulse") p.id = "pulse-" + n.id;
          if (cls === "pulse-wide") p.id = "pulsew-" + n.id;
          if (cls === "cable") p.id = "cable-" + n.id;
          svg.appendChild(p);
        });
        cables.push(n.id);
        makeCard(n, false);
      });

      /* ---------- motion ---------- */
      gsap.set("#camera", { transformOrigin: "540px 900px", scale: 0.86 });
      gsap.set("#tilt", { rotateX: 6, transformPerspective: 1600, transformOrigin: "50% 58%" });

      /* slow push-in across the whole 30s */
      tl.to("#camera", { scale: 1.12, duration: 30, ease: "power1.inOut" }, 0);
      tl.to("#camera", { x: -18, y: 12, duration: 15, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      /* core lands first */
      gsap.set("#core", { transformOrigin: "50% 50%" });
      tl.fromTo("#core", { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, 0.3);

      /* cables draw, each node pops as its cable lands */
      NODES.forEach(function (n, k) {
        var at = 1.1 + k * 0.42;
        var el = document.getElementById("cable-" + n.id);
        var len = el.getTotalLength();
        [".cable-glow", ""].forEach(function () {});
        ["cable-" + n.id].forEach(function (id) {
          var e = document.getElementById(id);
          gsap.set(e, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(e, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut", overwrite: "auto" }, at);
        });
        gsap.set("#card-" + n.id, { transformOrigin: "50% 50%" });
        tl.fromTo("#card-" + n.id, { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.9)" }, at + 0.35);

        /* everything floats on its own clock */
        var per = 8 + (k % 4) * 1.7;
        tl.to("#card-" + n.id, {
          y: k % 2 === 0 ? -16 : 14, x: k % 3 === 0 ? 9 : -7,
          duration: per / 2, ease: "sine.inOut", yoyo: true,
          repeat: Math.max(1, Math.ceil((30 - at) / (per / 2)) - 1), overwrite: "auto",
        }, at + 0.6);
      });

      tl.to("#core", { y: -11, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 4 }, 1.2);

      /* core fires a ring every 6s */
      gsap.set("#core-ring", { transformOrigin: "50% 50%" });
      for (var r = 0; r < 5; r++) {
        tl.fromTo("#core-ring", { scale: 0.5, opacity: 0.5 },
          { scale: 1.85, opacity: 0, duration: 2.6, ease: "power2.out",
            immediateRender: r === 0, overwrite: "auto" }, 2.4 + r * 6);
      }

      /* ---------- data pulses running the cables ---------- */
      function runPulse(id, start, dur, gap) {
        ["pulse-" + id, "pulsew-" + id].forEach(function (pid) {
          var el = document.getElementById(pid);
          var len = el.getTotalLength();
          var dash = pid.indexOf("pulsew") === 0 ? 150 : 110;
          gsap.set(el, { strokeDasharray: dash + " " + len, strokeDashoffset: dash });
          for (var p = 0; start + p * (dur + gap) + dur <= 30; p++) {
            var at = start + p * (dur + gap);
            tl.set(el, { opacity: pid.indexOf("pulsew") === 0 ? 0.55 : 1 }, at);
            tl.fromTo(el, { strokeDashoffset: dash },
              { strokeDashoffset: -len, duration: dur, ease: "sine.inOut", overwrite: "auto" }, at);
            tl.set(el, { opacity: 0 }, at + dur);
          }
        });
      }
      NODES.forEach(function (n, k) {
        runPulse(n.id, 4.4 + k * 0.55, 1.5, 3.4 + (k % 3) * 0.9);
      });

      /* ---------- background drifts for parallax ---------- */
      tl.to("#bg-panels", { y: -46, duration: 15, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      bgdots.forEach(function (el, k) {
        if (k % 3 !== 0) return;
        tl.to(el, { opacity: 0.06, duration: 3.75, ease: "sine.inOut", yoyo: true,
                    repeat: 7, overwrite: "auto" }, (k % 5) * 0.6);
      });

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
